name: Refresh GTA Data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GTA data and build indicators
        env:
          GTA_API_KEY: ${{ secrets.GTA_API_KEY }}
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicators.json data/indicators_export.csv data/interventions_download.csv data/records_cache.json
          git diff --cached --quiet || git commit -m "chore: refresh GTA indicators [$(date -u +%Y-%m-%d)]"
          git push
